<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC01-Alunos</title>
</head>
<body>
    <a href="/index.html">Home</a>
    <hr>
    <h4>Formulário</h4>
    <form action="" method="post">
        <label for="nome">Nome:</label> <br>
        <input type="text" id="nome" name="nome" required> <br><br>

        <label for="idade">Idade:</label> <br>
        <input type="number" id="idade" name="idade" required> <br>
        <br>
        <label for="curso">Curso:</label> <br>
        <select name="curso" id="curso" required>
            <option value="" disabled selected>Selecione um curso</option>
            <option value="javaScript">JavaScript</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
        </select>
        <br> <br>
        <label for="notaFinal">Nota Final:</label> <br>
        <input type="number" name="notaFinal" id="notaFinal" min="0" max="10" step="0.1" required>
        <br> <br>  <br> 
        <input type="submit" id="btnCadastrar" value="Cadastrar" >
        <hr>
        <table border=".1" cellpadding ="5" cellspacing="0">
            <thead>
                <tr>
                    <th bgcolor="gray" width="130">Nome</th>
                    <th bgcolor="gray" width="130">Idade</th>
                    <th bgcolor="gray" width="130">Curso</th>
                    <th bgcolor="gray" width="130">Nota Final</th>
                    <th bgcolor="gray" width="130">Ações</th>
                </tr>
            </thead>
            <tbody id="tabela">
            </tbody>

        </table>
    </form>
    <script src="scripts.js"></script>
</body>
</html>
